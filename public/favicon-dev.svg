<!--
  The dev server's favicon, so a dev tab never passes for the installed app. A
  copy of favicon.svg in gold: keep the paths in step with that file, and read
  its notes before you change anything here.

  Dark is pen-amber. Light is darker than pen-amber, which is 2.79 on the light
  tab strip and fails 3:1. This one is 3.32 on the strip and 4.35 on white.
-->
